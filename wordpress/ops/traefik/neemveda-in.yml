# neemveda.in + www.neemveda.in -> WordPress container (service "neemveda" in neemveda.yml).
# http://neemveda.in and www.neemveda.in get a 301 to https://neemveda.in from WordPress's .htaccess.
# Certificates: Let's Encrypt (resolver "letsencrypt").
http:
  routers:
    neemveda-in-http:
      rule: Host(`neemveda.in`) || Host(`www.neemveda.in`)
      priority: 250
      middlewares:
      - neemveda-headers
      service: neemveda
      entryPoints:
      - web
    neemveda-in-https:
      rule: Host(`neemveda.in`)
      priority: 250
      middlewares:
      - neemveda-headers
      service: neemveda
      entryPoints:
      - websecure
      tls:
        certResolver: letsencrypt
    neemveda-www-https:
      rule: Host(`www.neemveda.in`)
      priority: 250
      middlewares:
      - neemveda-headers
      service: neemveda
      entryPoints:
      - websecure
      tls:
        certResolver: letsencrypt
