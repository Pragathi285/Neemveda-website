# neemveda WordPress container neemveda-wp (/opt/neemveda/wordpress, docker compose).
# The shop lives at https://neemveda.in (routes in neemveda-in.yml). The old address neemveda.indobase.in
# is passed to WordPress, whose .htaccess answers with a 301 to https://neemveda.in (path + query kept).
# It keeps its own Let's Encrypt certificate so https://neemveda.indobase.in/... redirects without warnings.
http:
  routers:
    neemveda-http:
      rule: Host(`neemveda.indobase.in`)
      priority: 250
      middlewares:
      - neemveda-headers
      service: neemveda
      entryPoints:
      - web
    neemveda-https:
      rule: Host(`neemveda.indobase.in`)
      priority: 250
      middlewares:
      - neemveda-headers
      service: neemveda
      entryPoints:
      - websecure
      tls:
        certResolver: letsencrypt
  middlewares:
    neemveda-headers:
      headers:
        stsSeconds: 15552000
        contentTypeNosniff: true
        customFrameOptionsValue: SAMEORIGIN
        referrerPolicy: strict-origin-when-cross-origin
        permissionsPolicy: camera=(), microphone=(), payment=(), geolocation=(self)
        customResponseHeaders:
          Server: ''
          X-Powered-By: ''
  services:
    neemveda:
      loadBalancer:
        passHostHeader: true
        servers:
        - url: http://neemveda-wp:80
