# Put this block at the TOP of WordPress's .htaccess (/var/www/html/.htaccess), above # BEGIN WordPress.
# BEGIN neemveda redirects
# One permanent 301 hop to https://neemveda.in, keeping path and query string:
#   neemveda.indobase.in (old address), www.neemveda.in, and plain http://neemveda.in
<IfModule mod_rewrite.c>
RewriteEngine On
RewriteCond %{HTTP_HOST} ^(neemveda\.indobase\.in|www\.neemveda\.in)$ [NC]
RewriteRule ^ https://neemveda.in%{REQUEST_URI} [R=301,L]
RewriteCond %{HTTP_HOST} ^neemveda\.in$ [NC]
RewriteCond %{HTTP:X-Forwarded-Proto} =http
RewriteRule ^ https://neemveda.in%{REQUEST_URI} [R=301,L]
</IfModule>
# END neemveda redirects
