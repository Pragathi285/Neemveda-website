<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 520" role="img" aria-labelledby="t">
  <title id="t">neemveda Natural Neem Stick box, pack of 60</title>
  <defs>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf6ea"/>
      <stop offset="1" stop-color="#f1e8d4"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2d6bb"/>
      <stop offset="1" stop-color="#d3c5a6"/>
    </linearGradient>
    <linearGradient id="bark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a88d6b"/>
      <stop offset="1" stop-color="#6a543c"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="10"/></filter>
    <path id="lf" d="M0 0C10-9 28-11 44-3 31 3 13 5 0 0Z"/>
  </defs>
  <style>
    .h { font-family: Candara, 'Nunito Sans', 'Segoe UI', Arial, sans-serif; font-weight: 700; }
    .l { font-family: Corbel, Lato, 'Segoe UI', Arial, sans-serif; font-weight: 700; text-transform: uppercase; }
  </style>

  <ellipse cx="222" cy="478" rx="176" ry="16" fill="#2F4F2F" opacity=".28" filter="url(#sh)"/>

  <!-- top face -->
  <path d="M60 90 120 60H370L310 90Z" fill="#fdfaf2"/>
  <path d="M68 86 124 64H360" fill="none" stroke="#2F4F2F" stroke-opacity=".12" stroke-width="1.2"/>

  <!-- side face (sheared) -->
  <g transform="matrix(1 -.5 0 1 310 0)">
    <rect x="0" y="90" width="60" height="380" fill="url(#side)"/>
    <rect x="0" y="392" width="60" height="78" fill="#243d24"/>
    <text class="l" transform="translate(35 250) rotate(-90)" text-anchor="middle" font-size="9" letter-spacing="3" fill="#2F4F2F" opacity=".8">Natural Oral Care</text>
    <text class="h" transform="translate(37 430) rotate(-90)" text-anchor="middle" font-size="14" fill="#F7F1E4">neemveda</text>
  </g>

  <!-- front face -->
  <rect x="60" y="90" width="250" height="380" fill="url(#front)"/>
  <rect x="72" y="102" width="226" height="282" rx="6" fill="none" stroke="#2F4F2F" stroke-opacity=".22"/>

  <!-- brand -->
  <g transform="translate(167 116) scale(.9)">
    <path d="M7 33 33 7" fill="none" stroke="#2F4F2F" stroke-width="2.6" stroke-linecap="round" opacity=".55"/>
    <path d="M8 31C7 17 16 7.5 32 6.5 33 22 23.5 32 8 31Z" fill="#2F4F2F"/>
    <path d="M9.5 29.5 27 12" fill="none" stroke="#F7F1E4" stroke-width="1.3" stroke-linecap="round"/>
  </g>
  <text class="h" x="185" y="186" text-anchor="middle" font-size="35" fill="#2F4F2F" letter-spacing="-.5">neemveda</text>
  <text class="l" x="185" y="205" text-anchor="middle" font-size="8.5" letter-spacing="3.4" fill="#2F4F2F">Natural Oral Care</text>

