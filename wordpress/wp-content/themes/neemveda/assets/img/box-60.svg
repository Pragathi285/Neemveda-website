      <use href="#lf" fill="#557d45" transform="translate(6 0) rotate(40) scale(.62 -.62)"/>
      <use href="#lf" fill="#557d45" transform="translate(18 -.5) rotate(-36) scale(.7)"/>
      <use href="#lf" fill="#6f9455" transform="translate(24 -.5) rotate(36) scale(.7 -.7)"/>
      <use href="#lf" fill="#6f9455" transform="translate(37 -1.2) rotate(-30) scale(.66)"/>
      <use href="#lf" fill="#557d45" transform="translate(43 -1.2) rotate(30) scale(.66 -.66)"/>
      <use href="#lf" fill="#557d45" transform="translate(54 -2) rotate(-6) scale(.62)"/>
      <path d="M-14 1C10 0 34-1 56-2" fill="none" stroke="#557d45" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <g transform="rotate(16)">
      <rect x="-74" y="-6" width="148" height="12" rx="4" fill="url(#bark)"/>
      <ellipse cx="74" cy="0" rx="3.2" ry="6" fill="#e6d3a8"/>
    </g>
    <g transform="rotate(-12) translate(0 12)">
      <rect x="-70" y="-6" width="140" height="12" rx="4" fill="url(#bark)"/>
      <ellipse cx="70" cy="0" rx="3.2" ry="6" fill="#e6d3a8"/>
    </g>
    <rect x="-8" y="-14" width="7" height="40" rx="3" fill="#c4a26d" transform="rotate(4)"/>
    <rect x="1" y="-14" width="7" height="40" rx="3" fill="#b8955f" transform="rotate(4)"/>
  </g>

  <text class="h" x="185" y="350" text-anchor="middle" font-size="20" fill="#2F4F2F">Natural Neem Stick</text>
  <text class="l" x="185" y="368" text-anchor="middle" font-size="8.2" letter-spacing="2.4" fill="#554e4f">Traditional Toothbrush</text>

  <!-- green band -->
  <rect x="60" y="392" width="250" height="78" fill="#2F4F2F"/>
  <text class="l" x="185" y="425" text-anchor="middle" font-size="12.5" letter-spacing="2.6" fill="#FFFFFF">Pack of 60 Neem Sticks</text>
  <text class="l" x="185" y="448" text-anchor="middle" font-size="8" letter-spacing="2.2" fill="#cfdcc3">Chemical free · Plastic free</text>

  <!-- edges -->
  <path d="M60 90H310V470H60Z M310 90 370 60V440L310 470" fill="none" stroke="#2F4F2F" stroke-opacity=".12" stroke-width="1"/>
</svg>
