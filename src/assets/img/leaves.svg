<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="t">
  <title id="t">Fresh neem leaves and neem twigs on a light background</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4ecda"/>
      <stop offset="1" stop-color="#e6d9bc"/>
    </linearGradient>
    <linearGradient id="leafA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8db06a"/>
      <stop offset="1" stop-color="#4f7741"/>
    </linearGradient>
    <linearGradient id="leafB" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#557d45"/>
      <stop offset="1" stop-color="#97b971"/>
    </linearGradient>
    <linearGradient id="bark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ad9372"/>
      <stop offset=".42" stop-color="#836a4d"/>
      <stop offset="1" stop-color="#4d3c2a"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <g id="lf">
      <path d="M0 0C10-9 28-11 44-3 31 3 13 5 0 0Z"/>
      <path d="M3 0C15-3 29-4.5 41-3" fill="none" stroke="#24401f" stroke-opacity=".35" stroke-width=".9"/>
    </g>
    <g id="leaf">
      <path d="M0 50C60 48 130 46 214 38" fill="none" stroke="#6d8a50" stroke-width="2.6" stroke-linecap="round"/>
      <use href="#lf" fill="url(#leafA)" transform="translate(26 49.5) rotate(-42) scale(.85)"/>
      <use href="#lf" fill="url(#leafB)" transform="translate(36 49.3) rotate(42) scale(.85 -.85)"/>
      <use href="#lf" fill="url(#leafB)" transform="translate(56 48.8) rotate(-38) scale(.95)"/>
      <use href="#lf" fill="url(#leafA)" transform="translate(68 48.5) rotate(38) scale(.95 -.95)"/>
      <use href="#lf" fill="url(#leafA)" transform="translate(88 47.6) rotate(-36) scale(1.05)"/>
      <use href="#lf" fill="url(#leafB)" transform="translate(100 47.2) rotate(36) scale(1.05 -1.05)"/>
      <use href="#lf" fill="url(#leafB)" transform="translate(120 46.3) rotate(-33) scale(1.05)"/>
      <use href="#lf" fill="url(#leafA)" transform="translate(132 45.7) rotate(33) scale(1.05 -1.05)"/>
      <use href="#lf" fill="url(#leafA)" transform="translate(152 44.2) rotate(-30) scale(.98)"/>
      <use href="#lf" fill="url(#leafB)" transform="translate(164 43.4) rotate(30) scale(.98 -.98)"/>
      <use href="#lf" fill="url(#leafB)" transform="translate(182 41.6) rotate(-26) scale(.88)"/>
      <use href="#lf" fill="url(#leafA)" transform="translate(192 40.8) rotate(26) scale(.88 -.88)"/>
      <use href="#lf" fill="url(#leafA)" transform="translate(206 39) rotate(-6) scale(.95)"/>
    </g>
    <g id="twig">
      <rect x="0" y="0" width="300" height="20" rx="6" fill="url(#bark)"/>
      <path d="M12 5.5H286" stroke="#cbb08a" stroke-width="2" stroke-linecap="round" opacity=".5"/>
      <path d="M40 14h28M120 13h18M190 15h36" stroke="#3a2c1e" stroke-width="1.2" stroke-linecap="round" opacity=".45"/>
      <ellipse cx="300" cy="10" rx="5.5" ry="10" fill="#e3cf9f"/>
    </g>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <g opacity=".22" filter="url(#sh)" transform="translate(8 14)">
    <use href="#leaf" fill="#2F4F2F" transform="translate(40 150) rotate(18) scale(2.2)"/>
  </g>
  <use href="#leaf" transform="translate(40 150) rotate(18) scale(2.2)"/>
  <use href="#leaf" transform="translate(560 120) rotate(140) scale(1.7)"/>
  <ellipse cx="300" cy="455" rx="190" ry="14" fill="#2F4F2F" opacity=".2" filter="url(#sh)"/>
  <use href="#twig" transform="translate(140 410) rotate(-8)"/>
  <use href="#twig" transform="translate(150 438) rotate(-4) scale(.92 1)"/>
  <use href="#leaf" transform="translate(110 560) rotate(-20) scale(1.5)"/>
</svg>
