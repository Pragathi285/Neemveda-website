<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" role="img" aria-labelledby="t">
  <title id="t">Illustration of a large neem tree beside a village path at sunrise</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe3c6"/>
      <stop offset="1" stop-color="#f7f0df"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f3d79c"/>
      <stop offset=".6" stop-color="#f1d9a6" stop-opacity=".6"/>
      <stop offset="1" stop-color="#f1d9a6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6c39a"/>
      <stop offset="1" stop-color="#c2ab7d"/>
    </linearGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a4633"/>
      <stop offset=".5" stop-color="#7a634a"/>
      <stop offset="1" stop-color="#4c3b2b"/>
    </linearGradient>
  </defs>

  <rect width="600" height="520" fill="url(#sky)"/>
  <circle cx="455" cy="170" r="120" fill="url(#sun)"/>
  <circle cx="455" cy="170" r="38" fill="#f0cf8c" opacity=".85"/>

  <!-- distant hills -->
  <path d="M0 330c70-40 140-52 210-34 60 15 110 8 170-18 80-34 150-30 220 6v236H0Z" fill="#c6caa6" opacity=".7"/>
  <path d="M0 360c90-26 170-20 250 0 80 20 160 12 230-10 50-15 90-14 120-6v176H0Z" fill="#aab78f" opacity=".8"/>

  <!-- ground and path -->
  <path d="M0 400c120-18 260-22 380-12 90 8 160 6 220-4v136H0Z" fill="url(#ground)"/>
  <path d="M330 520c10-40 40-80 120-112 30-12 70-18 150-20v16c-70 4-110 12-136 24-62 30-84 62-94 92Z" fill="#e6d6b0" opacity=".8"/>

  <!-- small village hut -->
  <g transform="translate(470 330)">
    <rect x="0" y="22" width="62" height="44" fill="#d9c49c"/>
    <path d="M-8 26 31 0l39 26Z" fill="#8a6f50"/>
    <rect x="24" y="38" width="14" height="28" fill="#6e5740"/>
  </g>

  <!-- neem tree -->
  <g>
    <path d="M206 410c10-50 12-104 4-150l18-4c2 20 8 34 20 44 8-26 26-48 52-62l10 12c-26 16-42 40-46 72-2 22 0 56 10 88Z" fill="url(#trunk)"/>
    <path d="M210 290c-20-18-44-26-72-28l-2-12c32 0 60 10 80 28Z" fill="#5a4633"/>
    <path d="M232 300c18-40 46-68 86-84l6 10c-36 16-62 42-78 80Z" fill="#5a4633"/>
    <g opacity=".96">
      <circle cx="150" cy="226" r="56" fill="#557d45"/>
      <circle cx="214" cy="178" r="70" fill="#4a7040"/>
      <circle cx="290" cy="196" r="64" fill="#557d45"/>
      <circle cx="340" cy="238" r="46" fill="#4a7040"/>
      <circle cx="110" cy="270" r="40" fill="#4a7040"/>
      <circle cx="250" cy="122" r="50" fill="#5f8a4b"/>
      <circle cx="176" cy="132" r="44" fill="#5f8a4b"/>
      <circle cx="320" cy="150" r="40" fill="#6d9655"/>
      <circle cx="196" cy="252" r="48" fill="#3f6338"/>
      <circle cx="278" cy="260" r="42" fill="#3f6338"/>
      <circle cx="232" cy="210" r="52" fill="#2F4F2F" opacity=".55"/>
    </g>
    <g fill="#8db06a" opacity=".55">
      <circle cx="226" cy="96" r="16"/><circle cx="162" cy="110" r="12"/><circle cx="306" cy="128" r="14"/>
      <circle cx="122" cy="210" r="12"/><circle cx="350" cy="214" r="10"/><circle cx="270" cy="160" r="11"/>
    </g>
    <ellipse cx="226" cy="414" rx="120" ry="10" fill="#9c8660" opacity=".45"/>
  </g>

  <!-- grass tufts -->
  <g fill="none" stroke="#6d8a50" stroke-width="2" stroke-linecap="round" opacity=".8">
    <path d="M60 440l4-14M66 440l-2-16M72 440l6-12"/>
    <path d="M300 456l3-12M306 456l-1-15M311 456l5-11"/>
    <path d="M140 482l4-13M146 482l-2-15M152 482l6-11"/>
  </g>

  <!-- birds -->
  <g fill="none" stroke="#5a4633" stroke-width="1.8" stroke-linecap="round" opacity=".7">
    <path d="M400 92c4-4 8-4 11 0 3-4 7-4 11 0"/>
    <path d="M430 116c3-3 6-3 8 0 2-3 5-3 8 0"/>
    <path d="M378 120c3-3 6-3 8 0 2-3 5-3 8 0"/>
  </g>
</svg>
