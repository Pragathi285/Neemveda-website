<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{page.title}}</title>
  <meta name="description" content="{{page.description}}">
  <meta name="robots" content="{{page.robots}}">
  <link rel="canonical" href="{{page.canonical}}">
  <meta name="theme-color" content="#2F4F2F">

  <meta property="og:type" content="{{page.ogType}}">
  <meta property="og:site_name" content="neemveda">
  <meta property="og:locale" content="{{site.locale}}">
  <meta property="og:title" content="{{page.title}}">
  <meta property="og:description" content="{{page.description}}">
  <meta property="og:url" content="{{page.canonical}}">
  <meta property="og:image" content="{{page.ogImage}}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="neemveda: Rediscover Traditional Oral Care, with bundles of natural neem sticks">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{page.title}}">
  <meta name="twitter:description" content="{{page.description}}">
  <meta name="twitter:image" content="{{page.ogImage}}">

  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..700,0..100;1,9..144,400..600,0..100&family=Source+Sans+3:wght@400;600;700&family=Nunito+Sans:wght@800&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..700,0..100;1,9..144,400..600,0..100&family=Source+Sans+3:wght@400;600;700&family=Nunito+Sans:wght@800&display=swap"></noscript>
  <link rel="stylesheet" href="/assets/css/styles.css">
  <script>document.documentElement.classList.add('js')</script>
  <script src="/assets/js/data.js" defer></script>
  <script src="/assets/js/main.js" defer></script>
</head>
<body data-page="{{page.id}}">
{{> icons}}
<a class="skip-link" href="#main">Skip to content</a>
{{> header}}
<main id="main" tabindex="-1">
{{{content}}}
</main>
{{> footer}}
<a class="wa-float" href="https://wa.me/{{site.whatsapp}}?text=Hi%20neemveda%2C%20I%20have%20a%20question" target="_blank" rel="noopener" aria-label="Chat with us on WhatsApp (opens in a new tab)">
  <svg class="icon" aria-hidden="true"><use href="#i-whatsapp"/></svg>
</a>
<div class="toast" role="status" aria-live="polite" data-toast></div>
</body>
</html>
